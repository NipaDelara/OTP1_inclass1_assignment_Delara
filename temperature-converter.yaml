apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-converter
          image: temperature-converter:arm64
          imagePullPolicy: Never

          command:
            - /bin/bash
            - -c
          args:
            - |
              set -e
              Xvfb :99 -screen 0 1280x1024x24 -ac &
              export DISPLAY=:99

              until xdpyinfo -display :99 >/dev/null 2>&1; do
                sleep 1
              done

              exec mvn javafx:run

          env:
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: temperature-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temperature-db
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: "-Dprism.order=sw"